<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የሞባይል ላይቭ ቪዲዮ ማጋሪያ</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f0f2f5; text-align: center; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: left; }
        h2 { text-align: center; color: #007bff; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin: 5px 0; font-weight: bold; }
        button:hover { background: #0056b3; }
        textarea { width: 94%; height: 80px; font-size: 12px; margin: 5px 0; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
        video { width: 100%; background: black; border-radius: 8px; margin-top: 15px; min-height: 200px; }
        #status { font-style: italic; color: green; font-weight: bold; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

<div class="box">
    <h2>የሞባይል ላይቭ ማጋሪያ (Pure WebRTC)</h2>
    <div id="status">ለመጠቀም ዝግጁ ነው! (ምንም የውጭ ላይብረሪ የለበትም)</div>
    
    <!-- ክፍል 1 -->
    <div style="border-bottom: 1px dashed #ccc; padding-bottom: 10px; margin-bottom: 10px;">
        <p><strong>ደረጃ 1 (Sender):</strong> ምስል የሚልከው ሰው መጀመሪያ ይጫነው፡</p>
        <button id="start-btn">ካሜራህን አጋራና ኮድ ፍጠር</button>
        <p>የእርስዎ የጥሪ ኮድ (ይህንን ለጓደኛዎ ይላኩ)፡</p>
        <textarea id="offer-text" readonly placeholder="ኮዱ እዚህ ይፈጠራል..."></textarea>
    </div>

    <!-- ክፍል 2 -->
    <div style="border-bottom: 1px dashed #ccc; padding-bottom: 10px; margin-bottom: 10px;">
        <p><strong>ደረጃ 2 (Receiver):</strong> ምስል የሚያየው ሰው ከላይ የተላከለትን ኮድ እዚህ ያስገባ፡</p>
        <textarea id="input-offer" placeholder="የጓደኛዎን የጥሪ ኮድ እዚህ ያድርጉ..."></textarea>
        <button id="join-btn" style="background: #28a745;">የጥሪ ኮዱን ተቀበልና የምላሽ ኮድ ስራ</button>
        <p>የእርስዎ የምላሽ ኮድ (ይህንን ለስክሪን አጋሪው መልሰው ይላኩ)፡</p>
        <textarea id="answer-text" readonly placeholder="የምላሽ ኮድ እዚህ ይፈጠራል..."></textarea>
    </div>

    <!-- ክፍል 3 -->
    <div>
        <p><strong>ደረጃ 3 (Sender):</strong> ምስል የሚልከው ሰው ከጓደኛው የተላከውን ኮድ እዚህ ያስገባ፡</p>
        <textarea id="input-answer" placeholder="የምላሽ ኮዱን እዚህ ያድርጉ..."></textarea>
        <button id="finalize-btn" style="background: #ffc107; color: black;">ግንኙነቱን አጠናቅቅ</button>
    </div>
    
    <video id="view-video" autoplay playsinline muted></video>
</div>

<script>
    // የWebRTC ማዋቀሪያ (የጉግል ነጻ መተላለፊያ አድራሻ ብቻ)
    const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:://google.com" }] });
    let localStream;

    // ደረጃ 1፡ ላኪው ሲጫነው
    document.getElementById("start-btn").addEventListener("click", async () => {
        try {
            document.getElementById("status").innerText = "የስልክ ካሜራ ፈቃድ በመጠየቅ ላይ...";
            localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
            document.getElementById("view-video").srcObject = localStream;
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = (event) => {
                if (!event.candidate) {
                    document.getElementById("offer-text").value = btoa(JSON.stringify(pc.localDescription));
                    document.getElementById("status").innerText = "ኮዱ ተዘጋጅቷል! ኮፒ አድርገው ለጓደኛዎ ይላኩ።";
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
        } catch (err) {
            alert("ካሜራ መክፈት አልተቻለም፡ " + err.message);
        }
    });

    // ደረጃ 2፡ ተቀባዩ ሲጫነው
    document.getElementById("join-btn").addEventListener("click", async () => {
        const offerRaw = document.getElementById("input-offer").value.trim();
        if (!offerRaw) return alert("እባክዎ መጀመሪያ የጥሪ ኮዱን ያስገቡ!");

        try {
            const offerDesc = new RTCSessionDescription(JSON.parse(atob(offerRaw)));
            await pc.setRemoteDescription(offerDesc);

            pc.onicecandidate = (event) => {
                if (!event.candidate) {
                    document.getElementById("answer-text").value = btoa(JSON.stringify(pc.localDescription));
                    document.getElementById("status").innerText = "የምላሽ ኮዱ ተዘጋጅቷል! ኮፒ አድርገው መልሰው ይላኩ።";
                }
            };

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
        } catch (e) {
            alert("የተሳሳተ ኮድ አስግበዋል!");
        }
    });

    // ምስሉ ሲመጣ ማሳያ
    pc.ontrack = (event) => {
        document.getElementById("view-video").srcObject = event.streams[0];
        document.getElementById("status").innerText = "ምስል በተሳካ ሁኔታ እየመጣ ነው!";
    };

    // ደረጃ 3፡ ላኪው ግንኙነቱን ሲያጠናቅቅ
    document.getElementById("finalize-btn").addEventListener("click", async () => {
        const answerRaw = document.getElementById("input-answer").value.trim();
        if (!answerRaw) return alert("እባክዎ የምላሽ ኮዱን ያስገቡ!");

        try {
            const answerDesc = new RTCSessionDescription(JSON.parse(atob(answerRaw)));
            await pc.setRemoteDescription(answerDesc);
        } catch (e) {
            alert("የተሳሳተ የምላሽ ኮድ!");
        }
    });
</script>

</body>
</html>
