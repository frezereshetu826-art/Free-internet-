<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የሞባይል ላይቭ ቪዲዮ ማጋሪያ (Mobile Stream)</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f0f2f5; text-align: center; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin: 5px 0; font-weight: bold; }
        button:hover { background: #0056b3; }
        .btn-stop { background: #dc3545; }
        video { width: 100%; background: black; border-radius: 8px; margin-top: 15px; transform: scaleX(-1); }
        #status { font-style: italic; color: #666; margin: 10px 0; }
    </style>
</head>
<body>

<div class="box">
    <h2>የሞባይል ላይቭ ማጋሪያ</h2>
    <div id="status">ሰርቨር በመፈለግ ላይ...</div>
    
    <!-- ወገን 1፡ ላኪ (የስልኩን ካሜራ/ማሳያ የሚያጋራ) -->
    <button id="start-btn">1. ካሜራህን አጋራ (Sender)</button>
    
    <!-- ወገን 2፡ ተቀባይ (የሌላውን ስልክ የሚያይ) -->
    <button id="join-btn" style="background: #28a745;">2. የጓደኛህን ምስል እይ (Receiver)</button>
    
    <video id="view-video" autoplay playsinline muted></video>
</div>

<script>
    // 100% ነጻ እና ክፍት የሆነ የዌብሶኬት ማገናኛ ሰርቨር (ምንም ኮድ መጻፍ አይጠበቅብዎትም)
    const serverUrl = 'wss://connect.websocket.in/v3/1?api_key=public-demo-key';
    const socket = new WebSocket(serverUrl);

    const configuration = { iceServers: [{ urls: 'stun:://google.com' }] };
    let pc = new RTCPeerConnection(configuration);
    let localStream;

    socket.onopen = () => {
        document.getElementById('status').innerText = "ከመስመር ጋር ተገናኝቷል! ለመጠቀም ዝግጁ ነው።";
    };

    // መልዕክቶችን በራሱ መሃል ለመሃል መለዋወጫ ኮድ
    socket.onmessage = async (message) => {
        const data = JSON.parse(message.data);
        
        if (data.offer) {
            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            socket.send(JSON.stringify({ answer: pc.localDescription }));
        } else if (data.answer) {
            await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        } else if (data.candidate) {
            try {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            } catch (e) { console.error(e); }
        }
    };

    // አይስ ካንዲዴት በራሱ ለሌላኛው ስልክ ይልካል
    pc.onicecandidate = (event) => {
        if (event.candidate) {
            socket.send(JSON.stringify({ candidate: event.candidate }));
        }
    };

    // ምስሉ ሲመጣ ቪዲዮው ላይ ያሳያል
    pc.ontrack = (event) => {
        document.getElementById('view-video').srcObject = event.streams[0];
        document.getElementById('status').innerText = "በተሳካ ሁኔታ እየታየ ነው!";
    };

    // 1. ካሜራ አጋሪው ስልክ ሲጫነው
    document.getElementById('start-btn').addEventListener('click', async () => {
        try {
            document.getElementById('status').innerText = "የስልክ ካሜራ በመክፈት ላይ...";
            // ለሞባይል ብሮውዘር ፍጹም የሚሰራው የቪዲዮ መቅረጫ
            localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
            document.getElementById('view-video').srcObject = localStream;
            
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.send(JSON.stringify({ offer: pc.localDescription }));
            document.getElementById('status').innerText = "የእርስዎ ካሜራ እየተጋራ ነው... ለሌላኛው ሰው ንገሩት።";
        } catch (err) {
            alert("ካሜራ መክፈት አልተቻለም፡ እባክዎ የካሜራ ፍቃድ ይስጡ።");
        }
    });

    // 2. ተመልካቹ ስልክ ሲጫነው
    document.getElementById('join-btn').addEventListener('click', () => {
        document.getElementById('status').innerText = "ምስል ለመቀበል በመጠባበቅ ላይ...";
        // የዌብሶኬት ሰርቨሩ በራሱ ግንኙነቱን ያጠናቅቃል
    });
</script>
    window.onerror = function(msg, url, linenumber) {
    alert('የቴክኒክ ስህተት: ' + msg + '\nመስመር: ' + linenumber);
    return true;
};
</body>
</html>
