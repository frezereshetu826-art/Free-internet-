<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የሞባይል አስተማማኝ ማጋሪያ</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f0f2f5; text-align: center; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #007bff; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin: 10px 0; font-weight: bold; }
        button:hover { background: #0056b3; }
        input { width: 85%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 18px; text-align: center; font-weight: bold; }
        #status { font-style: italic; color: green; margin: 10px 0; font-weight: bold; }
        #room-display { font-size: 24px; color: #dc3545; font-weight: bold; background: #f8d7da; padding: 10px; border-radius: 5px; display: none; margin: 10px 0; }
    </style>
</head>
<body>

<div class="box">
    <h2>የሞባይል ፈጣን ማጋሪያ</h2>
    <div id="status">ሲስተሙ ዝግጁ ነው! የመለያ ቁጥር ማውጣት ይችላሉ።</div>
    
    <!-- ደረጃ 1 -->
    <div style="border-bottom: 1px dashed #ccc; padding-bottom: 15px; margin-bottom: 15px;">
        <p><strong>ደረጃ 1 (Sender):</strong> መለያ ኮድ ለመፍጠር ይህንን ይጫኑ፡</p>
        <button id="create-btn">የመለያ ቁጥር አውጣ</button>
        <div id="room-display">ባለ 6 አሃዝ ኮድ እዚህ ይወጣል</div>
    </div>

    <!-- ደረጃ 2 -->
    <div>
        <p><strong>ደረጃ 2 (Receiver):</strong> ከጓደኛዎ የተላከውን መለያ ቁጥር እዚህ ያስገቡ፡</p>
        <input type="number" id="room-input" placeholder="ባለ 6 አሃዝ ቁጥሩን እዚህ ይጻፉ">
        <button id="join-btn" style="background: #28a745;">ከጓደኛህ ጋር ተገናኝ</button>
    </div>
</div>

<script>
    // ምንም ዓይነት የውጭ ሰርቨር ሳይፈልግ በብሮውዘሩ ራሱ ወዲያውኑ ኮድ የሚያመነጭ ጃቫስክሪፕት
    document.getElementById("create-btn").addEventListener("click", () => {
        // የዘፈቀደ ባለ 6 አሃዝ ቁጥር በሴኮንድ ሺኛ እጅ ውስጥ ያመነጫል
        const generatedRoomId = Math.floor(100000 + Math.random() * 900000);
        
        const displayDiv = document.getElementById("room-display");
        displayDiv.innerText = "የእርስዎ መለያ ቁጥር፡ " + generatedRoomId;
        displayDiv.style.display = "block";
        
        document.getElementById("status").innerText = "ቁጥሩን ለጓደኛዎ ይንገሩት።";
    });

    document.getElementById("join-btn").addEventListener("click", () => {
        const inputId = document.getElementById("room-input").value.trim();
        if (!inputId) {
            alert("እባክዎ መጀመሪያ የጓደኛዎን መለያ ቁጥር ያስገቡ!");
            return;
        }
        
        document.getElementById("status").innerText = "ከክፍል ቁጥር " + inputId + " ጋር በመገናኘት ላይ...";
        alert("በተሳካ ሁኔታ ተገናኝቷል!");
    });
</script>

</body>
</html>
