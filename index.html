<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consent Screen Sharing</title>
  <script src="https://unpkg.com"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 30px auto;
      padding: 16px;
      background: #f4f4f4;
    }

    section {
      background: white;
      padding: 18px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      background: #1769aa;
      color: white;
      border: 0;
      border-radius: 5px;
    }

    button:disabled {
      background: #999;
    }

    video {
      width: 100%;
      background: black;
      margin-top: 15px;
      border-radius: 8px;
    }

    .notice {
      color: #555;
      font-size: 14px;
    }

    #status {
      font-weight: bold;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <h1>Screen Sharing</h1>

  <p class="notice">
    Screen sharing starts only after the owner presses the button and approves
    the browser permission request.
  </p>

  <section>
    <h2>Share my screen</h2>

    <label>Session passcode:</label>
    <input id="hostPassword" type="password" placeholder="Create a passcode">

    <button id="startButton">Start sharing</button>

    <p>Your session ID:</p>
    <input id="sessionId" readonly placeholder="Your ID will appear here">

    <video id="preview" autoplay muted playsinline></video>
  </section>

  <section>
    <h2>View a shared screen</h2>

    <label>Session ID:</label>
    <input id="viewerSessionId" placeholder="Enter the sharer's ID">

    <label>Passcode:</label>
    <input id="viewerPassword" type="password" placeholder="Enter passcode">

    <button id="connectButton">Connect</button>

    <video id="remoteVideo" autoplay playsinline controls></video>
  </section>

  <p id="status"></p>

  <script>
    let peer;
    let screenStream;
    let hostPassword;

    const statusText = document.getElementById("status");
    const sessionId = document.getElementById("sessionId");
    const preview = document.getElementById("preview");
    const remoteVideo = document.getElementById("remoteVideo");

    function status(message) {
      statusText.textContent = message;
    }

    // Host: start screen sharing
    document.getElementById("startButton").onclick = async () => {
      hostPassword = document.getElementById("hostPassword").value;

      if (hostPassword.length < 4) {
        alert("Use a passcode with at least 4 characters.");
        return;
      }

      try {
        // This displays the browser's official screen-sharing permission prompt.
        screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        preview.srcObject = screenStream;

        // Create a temporary peer session
        peer = new Peer();

        peer.on("open", id => {
          sessionId.value = id;
          status("Screen sharing is active. Send the session ID and passcode to the viewer.");
        });

        peer.on("connection", connection => {
          connection.on("data", data => {
            if (
              data &&
              data.type === "password" &&
              data.value === hostPassword
            ) {
              status("Viewer authenticated. Sending your screen.");

const call = peer.call(connection.peer, screenStream);

              call.on("close", () => {
                status("Viewer disconnected.");
              });
            } else {
              connection.send({
                type: "error",
                message: "Incorrect passcode."
              });
            }
          });
        });

        // Stop sharing if the user stops it from the browser's sharing control
        screenStream.getVideoTracks()[0].onended = () => {
          status("Screen sharing stopped.");
          if (peer) peer.destroy();
        };

      } catch (error) {
        status("Screen sharing was cancelled or is not supported.");
        console.error(error);
      }
    };

    // Viewer: connect to the host
    document.getElementById("connectButton").onclick = () => {
      const hostId = document.getElementById("viewerSessionId").value.trim();
      const password = document.getElementById("viewerPassword").value;

      if (!hostId || !password) {
        alert("Enter the session ID and passcode.");
        return;
      }

      peer = new Peer();

      peer.on("open", () => {
        const connection = peer.connect(hostId);

        connection.on("open", () => {
          connection.send({
            type: "password",
            value: password
          });

          status("Authentication request sent.");
        });

        connection.on("data", data => {
          if (data && data.type === "error") {
            status(data.message);
          }
        });

        peer.on("call", call => {
          call.answer();

          call.on("stream", stream => {
            remoteVideo.srcObject = stream;
            status("Connected. You are viewing the shared screen.");
          });

          call.on("close", () => {
            status("Screen sharing ended.");
            remoteVideo.srcObject = null;
          });
        });
      });

      peer.on("error", error => {
        status("Connection error: " + error.type);
        console.error(error);
      });
    };
  </script>
</body>
</html>
